version: 2.1

jobs:
  switch-fill--compact:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Stage fixture B
          command: |
            mkdir -p /tmp/camp
            set +o pipefail 2>/dev/null; tee /tmp/camp/tmp-8af3 < <(seq 1 1379629) | wc -l > /dev/null; true
            awk 'END{print "nr",NR}' /tmp/camp/tmp-8af3
      - persist_to_workspace:
          root: /tmp/camp
          paths:
            - 'tmp-8af3'
  sam-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/camp
      - run:
          name: Deserialize workspace payload
          command: |
            { tail -c 50 /tmp/camp/Af > /dev/null; echo "last 50B seen" ; } || true
      - run:
          name: Clone project
          command: git clone --depth 3 -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress and stage
          command: zcat main-images-prod.tgz | tar xf -
      - run:
          name: Collect artifacts
          command: free -m
      - run:
          command: sh -c "./guardian-rc2"
